<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户信息汇总后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            background: #f5f7fa;
            padding: 24px 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto 20px;
        }
        .header h1 { color: #1a2a3a; font-size: 28px; }
        .badge {
            background: #3498db;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
        }
        .controls {
            max-width: 1200px;
            margin: 0 auto 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-refresh {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(46,204,113,0.3);
        }
        .btn-refresh:active { transform: scale(0.97); }
        .count-info { color: #5a6a7a; font-size: 15px; }
        .card-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .customer-card {
            background: white;
            border-radius: 14px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-left: 5px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            transition: 0.2s;
        }
        .customer-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .info-left { display: flex; flex-direction: column; gap: 6px; }
        .info-left .company { font-size: 20px; font-weight: 700; color: #1a2a3a; }
        .info-left .detail { font-size: 15px; color: #4a5a6a; display: flex; flex-wrap: wrap; gap: 18px; }
        .info-left .detail span { background: #f0f4f8; padding: 2px 12px; border-radius: 20px; }
        .info-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .info-right .time { font-size: 14px; color: #8a9aa8; background: #f0f2f5; padding: 2px 14px; border-radius: 20px; }
        .info-right .salesman { font-weight: 700; color: #2c3e50; background: #eaf2f8; padding: 4px 16px; border-radius: 30px; }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #8a9aa8;
            font-size: 18px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 4px;
        }
        @media (max-width: 600px) {
            .customer-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .info-right { align-items: flex-start; width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: space-between; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>📊 客户信息汇总</h1>
    <span class="badge" id="totalCount">0 条</span>
</div>
<div class="controls">
    <button class="btn-refresh" id="refreshBtn">🔄 刷新数据</button>
    <span class="count-info">🕒 按提交时间倒序排列</span>
</div>
<div class="card-grid" id="cardContainer">
    <div class="empty">暂无客户数据，请等待业务员提交 ⏳</div>
</div>

<script>
    const API_URL = '/api/customers';
    const container = document.getElementById('cardContainer');
    const totalBadge = document.getElementById('totalCount');

    async function loadData() {
        try {
            const res = await fetch(API_URL);
            const result = await res.json();
            if (result.code === 0) {
                renderCards(result.data);
            } else {
                alert('加载失败：' + result.message);
            }
        } catch (err) {
            alert('❌ 连接不上服务器！请确认服务已启动（node server.js）');
        }
    }

    function renderCards(customers) {
        totalBadge.textContent = customers.length + ' 条';

        if (customers.length === 0) {
            container.innerHTML = '<div class="empty">🎯 暂无客户数据，请等待业务员提交</div>';
            return;
        }

        let html = '';
        customers.forEach(c => {
            html += `
                <div class="customer-card">
                    <div class="info-left">
                        <div class="company">🏢 ${escapeHtml(c.companyName)}</div>
                        <div class="detail">
                            <span>📇 联系人：${escapeHtml(c.contactName || '未填')}</span>
                            <span>📞 电话：${escapeHtml(c.contactPhone || '未填')}</span>
                            <span>🆔 信用代码：${escapeHtml(c.creditCode || '未填')}</span>
                        </div>
                    </div>
                    <div class="info-right">
                        <div class="salesman">👤 ${escapeHtml(c.salesman)}</div>
                        <div class="time">⏱️ ${escapeHtml(c.createdAt)}</div>
                        <button class="delete-btn" data-id="${c.id}">🗑️ 删除</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;

        // 绑定删除事件
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const id = this.dataset.id;
                if (confirm(`确定要删除 ID 为 ${id} 的客户吗？`)) {
                    await deleteItem(id);
                    await loadData(); // 刷新
                }
            });
        });
    }

    async function deleteItem(id) {
        try {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.code !== 0) {
                alert('删除失败：' + result.message);
            }
        } catch (err) {
            alert('删除请求失败');
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    document.getElementById('refreshBtn').addEventListener('click', loadData);

    // 页面加载自动刷新
    loadData();
</script>
</body>
</html>
