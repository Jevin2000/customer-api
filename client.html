<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客户/供应商信息上报</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f8;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0 10px; color: #1a2a3a; }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header p { color: #6b7a8a; font-size: 14px; margin-top: 4px; }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-top: 16px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .form-group label .required { color: #e74c3c; margin-left: 2px; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #dce1e8;
            border-radius: 12px;
            background: #fafbfc;
            transition: 0.2s;
            color: #1a2a3a;
        }
        .form-group input:focus {
            border-color: #3498db;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(52,152,219,0.15);
        }
        .form-group input::placeholder { color: #b0bcc8; font-size: 15px; }
        
        /* 单选按钮组 */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            font-size: 16px;
            cursor: pointer;
            color: #2c3e50;
        }
        .radio-group input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #3498db;
            margin: 0;
        }

        /* 复选框区域 */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f4f7fa;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 400;
            font-size: 15px;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: 0.2s;
            color: #2c3e50;
        }
        .checkbox-group label:has(input:checked) {
            background: #d4e6f1;
            border-color: #3498db;
            color: #1a3a5a;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3498db;
            margin: 0;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-weight: 700;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            letter-spacing: 2px;
            box-shadow: 0 4px 12px rgba(52,152,219,0.3);
        }
        .btn-submit:active { transform: scale(0.97); background: #2176ae; }
        .btn-submit:disabled { background: #a0b8cc; box-shadow: none; }
        #message {
            margin-top: 16px;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            display: none;
        }
        #message.success { display: block; background: #e8f8f0; color: #1a7a4a; border: 1px solid #b8e0cc; }
        #message.error { display: block; background: #fde8e8; color: #b03a2e; border: 1px solid #f5c8c8; }
        .footer-tip { text-align: center; color: #8a9aa8; font-size: 13px; margin-top: 24px; padding: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 客户/供应商信息上报</h1>
        <p>请业务员如实填写，周一统一汇总</p>
    </div>

    <div class="card">
        <!-- 第一层：业务关系（客户 / 供应商） -->
        <div class="form-group">
            <label>业务类型 <span class="required">*</span></label>
            <div class="radio-group">
                <label><input type="radio" name="entryType" value="客户" checked> 客户</label>
                <label><input type="radio" name="entryType" value="供应商"> 供应商</label>
            </div>
        </div>

        <!-- 第二层：主体类型（企业 / 个人） -->
        <div class="form-group">
            <label>主体类型 <span class="required">*</span></label>
            <div class="radio-group">
                <label><input type="radio" name="entityType" value="企业" checked> 企业</label>
                <label><input type="radio" name="entityType" value="个人"> 个人</label>
            </div>
        </div>

        <div class="form-group">
            <label>名称 <span class="required">*</span></label>
            <input type="text" id="companyName" placeholder="企业名称 / 个人姓名" />
        </div>

        <!-- 统一社会信用代码（企业用） -->
        <div class="form-group" id="creditCodeGroup">
            <label>统一社会信用代码 <span class="required">*</span></label>
            <input type="text" id="creditCode" placeholder="18位代码（必填）" />
        </div>

        <!-- 身份证号（个人用） -->
        <div class="form-group hidden" id="idCardGroup">
            <label>身份证号 <span class="required">*</span></label>
            <input type="text" id="idCard" placeholder="15或18位身份证号（必填）" />
        </div>

        <div class="form-group">
            <label>联系人姓名</label>
            <input type="text" id="contactName" placeholder="联系人姓名（选填）" />
        </div>
        <div class="form-group">
            <label>联系人电话</label>
            <input type="tel" id="contactPhone" placeholder="手机号（选填）" />
        </div>
        <div class="form-group">
            <label>业务员姓名 <span class="required">*</span></label>
            <input type="text" id="salesman" placeholder="请填写你的全名" />
        </div>

        <!-- 分配公司 -->
        <div class="form-group">
            <label>分配公司 <span class="required">*</span></label>
            <div class="checkbox-group" id="companyCheckboxes">
                <label><input type="checkbox" value="兴平面粉"> 兴平面粉</label>
                <label><input type="checkbox" value="富平面粉"> 富平面粉</label>
                <label><input type="checkbox" value="工业公司"> 工业公司</label>
                <label><input type="checkbox" value="米业公司"> 米业公司</label>
                <label><input type="checkbox" value="黑龙江米业"> 黑龙江米业</label>
            </div>
        </div>

        <button class="btn-submit" id="btnSubmit">✅ 提交信息</button>
        <div id="message"></div>
    </div>
    <div class="footer-tip">提交后数据将自动保存，请勿重复提交</div>
</div>

<script>
    const API_URL = '/api/customers';
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('message');

    // DOM 元素
    const entryTypeRadios = document.querySelectorAll('input[name="entryType"]');
    const entityTypeRadios = document.querySelectorAll('input[name="entityType"]');
    const companyName = document.getElementById('companyName');
    const creditCode = document.getElementById('creditCode');
    const idCard = document.getElementById('idCard');
    const creditCodeGroup = document.getElementById('creditCodeGroup');
    const idCardGroup = document.getElementById('idCardGroup');
    const contactName = document.getElementById('contactName');
    const contactPhone = document.getElementById('contactPhone');
    const salesman = document.getElementById('salesman');
    const companyCheckboxes = document.querySelectorAll('#companyCheckboxes input[type="checkbox"]');

    // 主体类型切换：显示/隐藏对应的证件输入框
    entityTypeRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === '企业') {
                creditCodeGroup.classList.remove('hidden');
                idCardGroup.classList.add('hidden');
            } else {
                creditCodeGroup.classList.add('hidden');
                idCardGroup.classList.remove('hidden');
            }
        });
    });

    function showMessage(text, type) {
        msg.textContent = text;
        msg.className = type;
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 5000);
    }

    // 身份证号校验
    function isValidIdCard(value) {
        return /(^\d{15}$)|(^\d{18}$)|(^\d{17}(\d|X|x)$)/.test(value);
    }

    // 统一社会信用代码校验
    function isValidCreditCode(value) {
        return /^[a-zA-Z0-9]{18}$/.test(value);
    }

    btn.addEventListener('click', async function() {
        // 1. 获取业务类型（客户/供应商）
        let entryType = '客户';
        entryTypeRadios.forEach(r => { if (r.checked) entryType = r.value; });

        // 2. 获取主体类型（企业/个人）
        let entityType = '企业';
        entityTypeRadios.forEach(r => { if (r.checked) entityType = r.value; });

        // 3. 获取证件号
        let idNumber = '';
        if (entityType === '企业') {
            idNumber = creditCode.value.trim();
        } else {
            idNumber = idCard.value.trim();
        }

        // 4. 收集选中的公司
        const assignedCompanies = [];
        companyCheckboxes.forEach(cb => {
            if (cb.checked) assignedCompanies.push(cb.value);
        });

        const data = {
            entryType: entryType,           // 客户 / 供应商
            entityType: entityType,         // 企业 / 个人
            companyName: companyName.value.trim(),
            idNumber: idNumber,
            contactName: contactName.value.trim(),
            contactPhone: contactPhone.value.trim(),
            salesman: salesman.value.trim(),
            assignedCompanies: assignedCompanies
        };

        // 前端校验
        if (!data.companyName) { showMessage('❌ 请填写名称', 'error'); companyName.focus(); return; }
        if (!data.idNumber) {
            const label = entityType === '企业' ? '统一社会信用代码' : '身份证号';
            showMessage('❌ 请填写' + label, 'error');
            return;
        }
        if (entityType === '企业' && !isValidCreditCode(data.idNumber)) {
            showMessage('❌ 统一社会信用代码格式不正确（需18位字母或数字）', 'error');
            return;
        }
        if (entityType === '个人' && !isValidIdCard(data.idNumber)) {
            showMessage('❌ 身份证号格式不正确（15位或18位，最后一位可为X）', 'error');
            return;
        }
        if (!data.salesman) { showMessage('❌ 请填写业务员姓名', 'error'); salesman.focus(); return; }
        if (data.assignedCompanies.length === 0) { showMessage('❌ 请至少选择一个分配公司', 'error'); return; }

        btn.disabled = true;
        btn.textContent = '⏳ 提交中...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (result.code === 0) {
                showMessage('✅ ' + result.message + '，感谢上报！', 'success');
                companyName.value = '';
                creditCode.value = '';
                idCard.value = '';
                contactName.value = '';
                contactPhone.value = '';
                salesman.value = '';
                companyCheckboxes.forEach(cb => cb.checked = false);
            } else {
                showMessage('❌ 提交失败：' + result.message, 'error');
            }
        } catch (err) {
            showMessage('❌ 网络连接失败，请检查网络', 'error');
        }

        btn.disabled = false;
        btn.textContent = '✅ 提交信息';
    });
</script>
</body>
</html>
