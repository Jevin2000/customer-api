<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客户/供应商信息上报</title>
    <!-- 引入 QRCode 库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f8;
            padding: 16px 16px 100px;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            padding: 12px 0 6px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a2a3a;
        }
        .header .sub {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 2px;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 16px;
            font-size: 13px;
            color: #5a6a7a;
        }
        .progress-bar .track {
            flex: 1;
            height: 4px;
            background: #dce1e8;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar .track .fill {
            height: 100%;
            background: #3498db;
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }
        .progress-bar .label {
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            min-width: 70px;
            text-align: right;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .segmented-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .segmented-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .segmented-item .seg-label {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
        }
        .segmented-item .seg-label .required {
            color: #e74c3c;
        }
        .segmented-control {
            display: flex;
            background: #f0f2f5;
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
        }
        .segmented-control .seg-option {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #5a6a7a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            border: none;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .segmented-control .seg-option.active {
            background: #ffffff;
            color: #1a2a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .segmented-control .seg-option:active {
            transform: scale(0.97);
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group:last-of-type {
            margin-bottom: 0;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #e74c3c;
            margin-left: 2px;
        }
        .form-group .hint {
            font-size: 12px;
            color: #8a9aa8;
            font-weight: 400;
            margin-left: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1.5px solid #dce1e8;
            border-radius: 10px;
            background: #fafbfc;
            transition: 0.2s;
            color: #1a2a3a;
            outline: none;
            -webkit-appearance: none;
        }
        .form-group input:focus {
            border-color: #3498db;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
        }
        .form-group input::placeholder {
            color: #b0bcc8;
            font-size: 15px;
        }
        .form-group input.error {
            border-color: #e74c3c;
            background: #fef6f6;
        }
        .form-group .error-msg {
            font-size: 13px;
            color: #e74c3c;
            margin-top: 4px;
            display: none;
        }
        .form-group .error-msg.show {
            display: block;
        }

        /* ⭐ 分配公司 - 自定义复选框，勾号显示在方框内 */
        .company-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }
        .company-list label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fafbfc;
            border: 1.5px solid #eef0f2;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 400;
            font-size: 15px;
            color: #2c3e50;
            margin: 0;
            user-select: none;
        }
        .company-list label:active {
            transform: scale(0.98);
        }
        .company-list label:has(input:checked) {
            background: #ebf5fb;
            border-color: #3498db;
        }

        /* ⭐ 自定义复选框：隐藏原生，自己画方框和对勾 */
        .company-list input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #c8d0d8;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin: 0;
            transition: all 0.15s;
        }
        .company-list input[type="checkbox"]:checked {
            background: #3498db;
            border-color: #3498db;
        }
        /* 勾号：用伪元素绘制，居中显示在方框内 */
        .company-list input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
            font-family: Arial, sans-serif;
        }

        .company-list .multi-hint {
            font-size: 13px;
            color: #8a9aa8;
            font-weight: 400;
            padding: 4px 0 0 4px;
        }

        .submit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
        }
        .submit-bar .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .submit-bar .btn-submit:active {
            transform: scale(0.97);
            background: #2176ae;
        }
        .submit-bar .btn-submit:disabled {
            background: #a0b8cc;
            box-shadow: none;
        }
        .submit-bar .btn-submit.success {
            background: #2ecc71;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }
        .submit-bar .footer-tip {
            text-align: center;
            font-size: 12px;
            color: #8a9aa8;
            margin-top: 8px;
        }
        .submit-bar .footer-tip strong {
            color: #5a6a7a;
        }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            z-index: 200;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.success {
            background: #2ecc71;
        }
        #toast.error {
            background: #e74c3c;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card {
            animation: fadeSlideUp 0.3s ease-out;
        }

        /* 二维码卡片 */
        .qr-card {
            text-align: center;
            padding: 16px !important;
            background: #fafbfc !important;
            border: 1.5px dashed #dce1e8 !important;
        }
        .qr-card .qr-title {
            font-size: 14px;
            color: #5a6a7a;
            margin-bottom: 10px;
        }
        .qr-card .qr-tip {
            font-size: 12px;
            color: #8a9aa8;
            margin-top: 10px;
        }
        .qr-card #qrcode {
            display: inline-block;
            background: white;
            padding: 10px;
            border-radius: 12px;
        }
        .qr-card #qrcode canvas {
            display: block;
            width: 160px;
            height: 160px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📋 客户/供应商信息</h1>
            <div class="sub">请业务员如实填写，信息将统一汇总</div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar">
            <span>填写进度</span>
            <div class="track">
                <div class="fill" id="progressFill" style="width:0%;"></div>
            </div>
            <span class="label" id="progressLabel">0/4</span>
        </div>

        <!-- 业务类型 & 主体类型 -->
        <div class="card">
            <div class="segmented-group">
                <div class="segmented-item">
                    <div class="seg-label">业务类型 <span class="required">*</span></div>
                    <div class="segmented-control" id="entryTypeControl">
                        <button class="seg-option active" data-value="客户">客户</button>
                        <button class="seg-option" data-value="供应商">供应商</button>
                    </div>
                </div>
                <div class="segmented-item">
                    <div class="seg-label">主体类型 <span class="required">*</span></div>
                    <div class="segmented-control" id="entityTypeControl">
                        <button class="seg-option active" data-value="企业">企业</button>
                        <button class="seg-option" data-value="个人">个人</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 表单字段 -->
        <div class="card">
            <div class="form-group">
                <label id="nameLabel">企业名称 <span class="required">*</span></label>
                <input type="text" id="companyName" placeholder="请输入企业名称" autocomplete="off" />
                <div class="error-msg" id="nameError"></div>
            </div>

            <div class="form-group" id="idGroup">
                <label id="idLabel">统一社会信用代码 <span class="required">*</span></label>
                <input type="text" id="idNumber" placeholder="请输入18位统一社会信用代码" autocomplete="off" maxlength="18" />
                <div class="error-msg" id="idError">格式不正确，请输入18位字母或数字</div>
            </div>

            <div class="form-group">
                <label>联系人 <span class="hint">（选填）</span></label>
                <input type="text" id="contactName" placeholder="请输入联系人姓名" autocomplete="off" />
            </div>

            <div class="form-group">
                <label>联系电话 <span class="hint">（选填）</span></label>
                <input type="tel" id="contactPhone" placeholder="请输入手机号码" autocomplete="off" />
            </div>

            <div class="form-group">
                <label>业务员 <span class="required">*</span></label>
                <input type="text" id="salesman" placeholder="请填写你的全名" autocomplete="off" />
                <div class="error-msg" id="salesmanError"></div>
            </div>
        </div>

        <!-- 分配公司（真实公司名称） -->
        <div class="card">
            <div class="form-group">
                <label>分配公司 <span class="required">*</span> <span class="hint">（可多选）</span></label>
                <div class="company-list" id="companyList">
                    <label>
                        <input type="checkbox" value="兴平面粉"> 兴平面粉
                    </label>
                    <label>
                        <input type="checkbox" value="富平面粉"> 富平面粉
                    </label>
                    <label>
                        <input type="checkbox" value="工业公司"> 工业公司
                    </label>
                    <label>
                        <input type="checkbox" value="米业公司"> 米业公司
                    </label>
                    <label>
                        <input type="checkbox" value="黑龙江米业"> 黑龙江米业
                    </label>
                    <div class="multi-hint">💡 可同时选择多个公司</div>
                </div>
                <div class="error-msg" id="companyError">请至少选择一个分配公司</div>
            </div>
        </div>

        <!-- 二维码卡片 -->
        <div class="card qr-card">
            <div class="qr-title">📲 扫码直达填表页面</div>
            <div id="qrcode"></div>
            <div class="qr-tip">长按二维码保存到相册，下次扫码直接填</div>
        </div>

        <div style="height: 20px;"></div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- 底部固定提交栏 -->
    <div class="submit-bar">
        <button class="btn-submit" id="btnSubmit">📤 提交信息</button>
        <div class="footer-tip"><strong>提交后系统会自动保存</strong>，请勿重复点击</div>
    </div>

    <script>
        (function() {
            'use strict';

            const entryControl = document.getElementById('entryTypeControl');
            const entityControl = document.getElementById('entityTypeControl');
            const companyName = document.getElementById('companyName');
            const idNumber = document.getElementById('idNumber');
            const idLabel = document.getElementById('idLabel');
            const nameLabel = document.getElementById('nameLabel');
            const contactName = document.getElementById('contactName');
            const contactPhone = document.getElementById('contactPhone');
            const salesman = document.getElementById('salesman');
            const companyCheckboxes = document.querySelectorAll('#companyList input[type="checkbox"]');
            const btnSubmit = document.getElementById('btnSubmit');
            const toast = document.getElementById('toast');
            const progressFill = document.getElementById('progressFill');
            const progressLabel = document.getElementById('progressLabel');

            const nameError = document.getElementById('nameError');
            const idError = document.getElementById('idError');
            const salesmanError = document.getElementById('salesmanError');
            const companyError = document.getElementById('companyError');

            let entryType = '客户';
            let entityType = '企业';

            function showToast(text, type = 'success', duration = 2500) {
                toast.textContent = text;
                toast.className = type + ' show';
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            function updateProgress() {
                let filled = 0;
                if (companyName.value.trim()) filled++;
                if (idNumber.value.trim()) filled++;
                if (salesman.value.trim()) filled++;
                const hasCompany = Array.from(companyCheckboxes).some(cb => cb.checked);
                if (hasCompany) filled++;
                const total = 4;
                const pct = Math.min(100, Math.round((filled / total) * 100));
                progressFill.style.width = pct + '%';
                progressLabel.textContent = filled + '/' + total;
            }

            function updateEntityType() {
                if (entityType === '企业') {
                    nameLabel.innerHTML = '企业名称 <span class="required">*</span>';
                    companyName.placeholder = '请输入企业名称';
                    idLabel.innerHTML = '统一社会信用代码 <span class="required">*</span>';
                    idNumber.placeholder = '请输入18位统一社会信用代码';
                    idNumber.maxLength = 18;
                    idError.textContent = '格式不正确，请输入18位字母或数字';
                } else {
                    nameLabel.innerHTML = '姓名 <span class="required">*</span>';
                    companyName.placeholder = '请输入个人姓名';
                    idLabel.innerHTML = '身份证号 <span class="required">*</span>';
                    idNumber.placeholder = '请输入15或18位身份证号';
                    idNumber.maxLength = 18;
                    idError.textContent = '格式不正确，请输入15位或18位身份证号（末位可为X）';
                }
                clearFieldError(idNumber, idError);
                clearFieldError(companyName, nameError);
                updateProgress();
            }

            function clearFieldError(input, errorEl) {
                input.classList.remove('error');
                if (errorEl) errorEl.classList.remove('show');
            }

            function showFieldError(input, errorEl) {
                input.classList.add('error');
                if (errorEl) errorEl.classList.add('show');
            }

            function validateIdCard(val) {
                return /(^\d{15}$)|(^\d{18}$)|(^\d{17}(\d|X|x)$)/.test(val);
            }

            function validateCreditCode(val) {
                return /^[a-zA-Z0-9]{18}$/.test(val);
            }

            function validateForm() {
                let isValid = true;

                const nameVal = companyName.value.trim();
                if (!nameVal) {
                    showFieldError(companyName, nameError);
                    nameError.textContent = '请填写' + (entityType === '企业' ? '企业名称' : '姓名');
                    isValid = false;
                } else {
                    clearFieldError(companyName, nameError);
                }

                const idVal = idNumber.value.trim().toUpperCase();
                idNumber.value = idVal;
                let idValid = false;
                if (entityType === '企业') {
                    idValid = validateCreditCode(idVal);
                } else {
                    idValid = validateIdCard(idVal);
                }
                if (!idVal || !idValid) {
                    showFieldError(idNumber, idError);
                    isValid = false;
                } else {
                    clearFieldError(idNumber, idError);
                }

                const salesmanVal = salesman.value.trim();
                if (!salesmanVal) {
                    showFieldError(salesman, salesmanError);
                    salesmanError.textContent = '请填写业务员姓名';
                    isValid = false;
                } else {
                    clearFieldError(salesman, salesmanError);
                }

                const hasCompany = Array.from(companyCheckboxes).some(cb => cb.checked);
                if (!hasCompany) {
                    companyError.classList.add('show');
                    isValid = false;
                } else {
                    companyError.classList.remove('show');
                }

                updateProgress();
                return isValid;
            }

            companyName.addEventListener('input', function() {
                if (this.value.trim()) clearFieldError(this, nameError);
                updateProgress();
            });

            idNumber.addEventListener('input', function() {
                let val = this.value.toUpperCase();
                this.value = val;
                let valid = false;
                if (entityType === '企业') {
                    valid = validateCreditCode(val);
                } else {
                    valid = validateIdCard(val);
                }
                if (val && !valid) {
                    showFieldError(this, idError);
                } else {
                    clearFieldError(this, idError);
                }
                updateProgress();
            });

            salesman.addEventListener('input', function() {
                if (this.value.trim()) clearFieldError(this, salesmanError);
                updateProgress();
            });

            companyCheckboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const hasCompany = Array.from(companyCheckboxes).some(c => c.checked);
                    if (hasCompany) companyError.classList.remove('show');
                    updateProgress();
                });
            });

            function setupSegmented(control, callback) {
                const options = control.querySelectorAll('.seg-option');
                options.forEach(opt => {
                    opt.addEventListener('click', function() {
                        options.forEach(o => o.classList.remove('active'));
                        this.classList.add('active');
                        callback(this.dataset.value);
                    });
                });
            }

            setupSegmented(entryControl, function(val) {
                entryType = val;
            });

            setupSegmented(entityControl, function(val) {
                entityType = val;
                updateEntityType();
            });

            btnSubmit.addEventListener('click', async function() {
                if (!validateForm()) {
                    showToast('请完善所有必填信息', 'error', 2000);
                    return;
                }

                const assignedCompanies = [];
                companyCheckboxes.forEach(cb => {
                    if (cb.checked) assignedCompanies.push(cb.value);
                });

                const payload = {
                    entryType: entryType,
                    entityType: entityType,
                    companyName: companyName.value.trim(),
                    idNumber: idNumber.value.trim().toUpperCase(),
                    contactName: contactName.value.trim(),
                    contactPhone: contactPhone.value.trim(),
                    salesman: salesman.value.trim(),
                    assignedCompanies: assignedCompanies
                };

                btnSubmit.disabled = true;
                btnSubmit.textContent = '⏳ 提交中...';

                try {
                    const response = await fetch('/api/customers', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (result.code === 0) {
                        btnSubmit.textContent = '✅ 已提交';
                        btnSubmit.classList.add('success');
                        showToast('🎉 提交成功！客户信息已保存', 'success', 3000);
                        companyName.value = '';
                        idNumber.value = '';
                        contactName.value = '';
                        contactPhone.value = '';
                        companyCheckboxes.forEach(cb => cb.checked = false);
                        document.querySelectorAll('.form-group input').forEach(inp => {
                            inp.classList.remove('error');
                        });
                        document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
                        updateProgress();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(() => {
                            btnSubmit.disabled = false;
                            btnSubmit.textContent = '📤 提交信息';
                            btnSubmit.classList.remove('success');
                        }, 5000);
                    } else {
                        showToast('❌ ' + result.message, 'error', 2500);
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = '📤 提交信息';
                    }
                } catch (err) {
                    showToast('❌ 网络连接失败，请检查网络后重试', 'error', 3000);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = '📤 提交信息';
                }
            });

            function initQRCode() {
                const qrContainer = document.getElementById('qrcode');
                if (!qrContainer) return;
                const url = window.location.origin + window.location.pathname;
                qrContainer.innerHTML = '';
                try {
                    new QRCode(qrContainer, {
                        text: url,
                        width: 160,
                        height: 160,
                        colorDark: '#1a2a3a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (e) {
                    console.warn('QRCode 库未加载');
                }
            }

            function init() {
                entityType = '企业';
